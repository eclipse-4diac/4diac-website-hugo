  - name: "OFFIS - Institute for Information Technology, Oldenburg, Germany"
    type: "Research Institution"
    topics:
      - "Custom Development"
      - "Hardware Integration"
      - "Communication Development"
      - "Specialized Training"
      - "Architecture Review"
      - "Migration & Modernization"
      - "Research Collaboration"
    description: >
        OFFIS is a research institute associated with the University of Oldenburg, Germany. Its R&D division Manufacturing, research group Distributed Computing and Communication,
        is experienced in embedded systems design for industrial automation and other application fields. OFFIS is a long-time contributor to 4diac, working on 4diac FORTE and being
        the initial developer of 4diac FBE. Their expertise is in system engineering, development methodology, tool automation, deployment, and deeply embedded hard- and software.
    link: "https://www.offis.de/anwendungen/produktion/distributed-computing-and-communication.html"
    email: "joerg.walter@offis.de"

