    description: >
        LIT Cyber-Physical Systems Lab researches on software engineering methods for control systems and is a long time contributor to Eclipse 4diac.
        They have a strong focus on tool infrastructures, user experience, control software design patterns and quality assessment, and extensions to IEC 61499.
    link: "https://www.jku.at/lit-cyber-physical-systems-lab/"
